<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a1e" />

    <title>Lumen — share videos and go live</title>
    <meta name="description" content="Watch creators around the world, share your own videos, and go live in seconds." />

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph defaults. The server may rewrite the OG block for /watch/:id and /live/:id. -->
    <!-- OG -->
    <meta property="og:site_name" content="Lumen" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lumen — share videos and go live" />
    <meta property="og:description" content="Watch creators around the world, share your own videos, and go live in seconds." />
    <meta property="og:image" content="/icon-512.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /OG -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
