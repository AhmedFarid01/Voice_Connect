version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      # Inside the network the app reaches the DB at host "postgres", regardless
      # of what DATABASE_URL says in your .env (which targets your host machine
      # for local `npm run dev`). We construct the in-network URL here.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lumen_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-prod}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # OAuth — leave blank to disable a provider; the UI hides buttons that
      # aren't configured.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-Lumen <no-reply@lumen.local>}
      # If you're running with a named tunnel, set PUBLIC_BASE_URL=https://your.domain
      # in .env so password-reset emails contain the correct link.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CLOUDFLARE_TUNNEL_HOSTNAME=${CLOUDFLARE_TUNNEL_HOSTNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lumen_uploads:/app/uploads
    networks:
      - lumen-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-lumen_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - lumen-network
    command: postgres -c 'max_connections=200'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Public HTTPS URL for demos — Quick tunnel (random *.trycloudflare.com URL,
  # no Cloudflare account needed). Started by `npm run demo` when no tunnel
  # token is configured.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://app:5000 --no-autoupdate
    depends_on:
      - app
    networks:
      - lumen-network
    profiles:
      - demo

  # Public HTTPS URL on YOUR domain — Named tunnel. Set CLOUDFLARE_TUNNEL_TOKEN
  # (and optionally CLOUDFLARE_TUNNEL_HOSTNAME for nicer log output) in .env,
  # then `npm run demo` picks this profile automatically.
  cloudflared-named:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    networks:
      - lumen-network
    profiles:
      - demo-named

volumes:
  postgres_data:
  lumen_uploads:

networks:
  lumen-network:
    driver: bridge
