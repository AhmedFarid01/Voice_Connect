version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voip_db}
      - ASTERISK_HOST=asterisk
      - ASTERISK_PORT=5060
    depends_on:
      - postgres
      - asterisk
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - voip-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-voip_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - voip-network
    command: postgres -c 'max_connections=200'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  asterisk:
    image: andrius/asterisk
    ports:
      - "5060:5060/udp"    # SIP
      - "10000-10100:10000-10100/udp"  # RTP
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_sounds:/var/lib/asterisk/sounds
      - asterisk_voicemail:/var/spool/asterisk/voicemail
    networks:
      - voip-network
    environment:
      - ASTERISK_ADMIN_PASSWORD=${ASTERISK_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show version' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  asterisk_config:
  asterisk_sounds:
  asterisk_voicemail:

networks:
  voip-network:
    driver: bridge